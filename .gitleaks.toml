title = "ShellKode hardened gitleaks config for AWS/GCP/GenAI"

[extend]
# You can extend upstream defaults later if needed:
# path = ""

[allowlist]
description = "Allow common non-source/binary assets"
# Keep this tight, do NOT allow source files here.
paths = [
  '''^LICENSE$''',
  '''^CHANGELOG\.md$''',
  '''\.png$''',
  '''\.jpg$''',
  '''\.jpeg$''',
  '''\.gif$''',
  '''\.svg$''',
  '''\.ico$''',
  '''\.pdf$''',
  '''\.mp4$''',
  '''\.mov$''',
  '''\.zip$''',
  '''\.gz$''',
  '''\.tgz$''',
  '''\.lock$''',
  '''\.min\.js$'''
]

# ---------------------------
# Core rules: Secrets & Keys
# ---------------------------

# 0) No localhost
[[rules]]
id = "localhost-endpoint"
description = "Disallow localhost or 127.0.0.1 in committed code"
regex = '''(?i)(localhost|127\.0\.0\.1)(:[0-9]{2,5})?'''
tags = ["network","endpoints","dev-only","medium"]

# 1) Private keys & certificates
[[rules]]
id = "generic-private-key"
description = "Private Key material"
regex = '''-----BEGIN\s+(?:RSA|DSA|EC|PGP|OPENSSH|PRIVATE)\s+PRIVATE\s+KEY-----'''
tags = ["key","crypto","high"]

[[rules]]
id = "ssh-private-key"
description = "OpenSSH private key"
regex = '''-----BEGIN OPENSSH PRIVATE KEY-----'''
tags = ["key","ssh","high"]

# 2) AWS (even if we use IAM Roles Anywhere, block accidental keys)
[[rules]]
id = "aws-access-key-id"
description = "AWS Access Key ID"
regex = '''(?i)\b(A3T|AKIA|ASIA|AGPA|AIDA|AROA|AIPA|ANPA)[A-Z0-9]{16}\b'''
tags = ["aws","credentials","high"]

[[rules]]
id = "aws-secret-access-key"
description = "AWS Secret Access Key"
regex = '''(?i)aws(.{0,20})?(secret|ses)?(.{0,20})?(access)?(.{0,20})?(key|token)['"\s:=]{1,3}([A-Za-z0-9/+=]{40})'''
tags = ["aws","credentials","high"]

[[rules]]
id = "aws-session-token"
description = "AWS Session Token"
regex = '''(?i)(x-amz-security-token|aws_session_token)['"\s:=]{1,3}([A-Za-z0-9/+]{40,})'''
tags = ["aws","credentials","medium"]

# 3) GCP service accounts & API keys
[[rules]]
id = "gcp-service-account"
description = "GCP Service Account JSON (private_key)"
regex = '''(?s)"type"\s*:\s*"service_account".+"private_key"\s*:\s*"-----BEGIN PRIVATE KEY-----'''
tags = ["gcp","credentials","high"]

[[rules]]
id = "gcp-api-key"
description = "Google API Key"
regex = '''\bAIza[0-9A-Za-z\-_]{35}\b'''
tags = ["gcp","api","high"]

[[rules]]
id = "gcp-oauth-client-secret"
description = "Google OAuth Client Secret"
regex = '''(?i)("client_secret"|GOOGLE_CLIENT_SECRET|GCP_OAUTH_CLIENT_SECRET)\s*[:=]\s*["'][A-Za-z0-9_\-]{8,}["']'''
tags = ["gcp","oauth","high"]

# 4) GitHub tokens (PATs and fine-grained)
[[rules]]
id = "github-pat-classic"
description = "GitHub classic PAT (ghp_)"
regex = '''\bghp_[A-Za-z0-9]{36}\b'''
tags = ["github","credentials","high"]

[[rules]]
id = "github-fine-grained-pat"
description = "GitHub fine-grained PAT (github_pat_)"
regex = '''\bgithub_pat_[0-9a-zA-Z_]{82}\b'''
tags = ["github","credentials","high"]

# 5) Common GenAI provider keys (guard rails even if we prefer IAM/SigV4)
[[rules]]
id = "openai-key"
description = "OpenAI API Key"
regex = '''\bsk-[A-Za-z0-9]{32,48}\b'''
tags = ["genai","openai","credentials","high"]

[[rules]]
id = "anthropic-key"
description = "Anthropic API Key"
regex = '''\bsk-ant-[A-Za-z0-9_-]{20,}\b'''
tags = ["genai","anthropic","credentials","high"]

[[rules]]
id = "google-genai-key"
description = "Google Generative AI (PaLM/Gemini) Key"
regex = '''\bAIza[0-9A-Za-z\-_]{35}\b'''
tags = ["genai","gcp","credentials","high"]

# 6) Slack, OAuth, and JWTs (often present in automation/agents)
[[rules]]
id = "slack-token"
description = "Slack token"
regex = '''\bxox[baprs]-\d{12,}-\d{12,}-[A-Za-z0-9]{24,}\b'''
tags = ["oauth","slack","credentials","high"]

[[rules]]
id = "jwt-token"
description = "Likely JWT"
regex = '''eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}'''
tags = ["jwt","token","medium"]

# 7) Database credentials & URIs (RDS, Cloud SQL, etc.)
[[rules]]
id = "db-connection-uri"
description = "Database connection URI with credentials"
regex = '''(?i)\b(jdbc:|postgres(ql)?:\/\/|mysql:\/\/|sqlserver:\/\/|mongodb(\+srv)?:\/\/)[^@\s]+:[^@\s]+@'''
tags = ["db","credentials","high"]

[[rules]]
id = "generic-password-assignment"
description = "Generic password assignment"
regex = '''(?i)\b(pass(word)?|pwd|secret|token)\s*[:=]\s*['"][^'"]{6,}['"]'''
tags = ["generic","credentials","medium"]

# 8) Cloud-specific misc
[[rules]]
id = "firebase-url"
description = "Firebase DB URL"
regex = '''https?://[a-z0-9-]+\.firebaseio\.com'''
tags = ["gcp","firebase","medium"]

# ---------------------------
# Heuristics: high-entropy near sensitive keys
# ---------------------------
[[rules]]
id = "high-entropy-generic"
description = "High-entropy string near sensitive keywords"
regex = '''(?i)(api[_-]?key|secret|token|password|passwd|pwd|client[_-]?secret)['"\s:=]{1,5}[A-Za-z0-9/_+=\-.]{16,}'''
entropy = 3.7
tags = ["heuristic","credentials","medium"]

# ---------------------------
# GLOBAL options
# ---------------------------
[rules_config]
# Treat high-confidence leaks as fail; medium can be tuned later.
# Options: "off" | "low" | "medium" | "high"
generic-private-key = "high"
ssh-private-key = "high"
aws-access-key-id = "high"
aws-secret-access-key = "high"
aws-session-token = "medium"
gcp-service-account = "high"
gcp-api-key = "high"
gcp-oauth-client-secret = "high"
github-pat-classic = "high"
github-fine-grained-pat = "high"
openai-key = "high"
anthropic-key = "high"
google-genai-key = "high"
slack-token = "high"
jwt-token = "medium"
db-connection-uri = "high"
generic-password-assignment = "medium"
firebase-url = "medium"
high-entropy-generic = "medium"

[report]
format = "sarif"
path = ".git/gitleaks.sarif"
redact = true
