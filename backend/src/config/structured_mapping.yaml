# Structured (key-value) JSON -> lead and document fields, used in the "structured"
# mode (no LLM). A path joins keys with "."; a path starting with "$." starts at the
# top of the file, any other path starts inside the person's section.
# A field is one path, a list of paths (first value found wins), or
# {join: [paths], sep: " "} to join several values (names with a space, addresses
# with ", "), or {join_all: path, sep: ", "} to join every part of one object.

application_form:
  application_no: "$.Office Use Details.Application No/ SL No"
  lead_id: "$.Office Use Details.Lead Id"

  applicant:
    section: "Applicant"
    fields:
      passport_or_dl_number: "Passport/ DL. No"
      admission_status: "$.Course Details.Admission Status"
      university: "$.Course Details.University"
      course: "$.Course Details.Course Name"
      country: "$.Course Details.Country"

  # "Co-Applicant 1", "Co-Applicant 2", ... until a section is missing.
  co_applicants:
    section: "Co-Applicant {n}"
    max: 6
    relationship: "Relationship with Applicant"
    fields:
      passport_or_dl_number: "Passport/ DL. No"
      bank_name: "Bank Details (Transactional A/C).Name of Bank"
      account_number: "Bank Details (Transactional A/C).Account Number"
      employer_name: "Employment or Business Details.Name of the Current Employer or Business/Firm"
      employer_address:
        join:
          - "Employment or Business Details.Address of the Employer or Business/Firm.Address"
          - "Employment or Business Details.Address of the Employer or Business/Firm.Landmark"
          - "Employment or Business Details.Address of the Employer or Business/Firm.City"
          - "Employment or Business Details.Address of the Employer or Business/Firm.District"
          - "Employment or Business Details.Address of the Employer or Business/Firm.State"
          - "Employment or Business Details.Address of the Employer or Business/Firm.Pincode"
          - "Employment or Business Details.Address of the Employer or Business/Firm.Country"
        sep: ", "

  # Fields every person has (applicant and co-applicants).
  person_fields:
    name: {join: ["Name.First Name", "Name.Middle Name", "Name.Last Name"], sep: " "}
    father_name:
      join: ["Father/ Spouse Name.First Name", "Father/ Spouse Name.Middle Name", "Father/ Spouse Name.Last Name"]
      sep: " "
    mother_name:
      join: ["Mother's Name.First Name", "Mother's Name.Middle Name", "Mother's Name.Last Name"]
      sep: " "
    dob: "Date of Birth"
    gender: "Gender"
    mobile: "Mobile No"
    email: "Email ID"
    pan: "PAN No"
    aadhaar_last4: "Aadhar No.Number"
    voter_id: "Voter ID"
    address:
      join:
        - "Current Address.Address"
        - "Current Address.Landmark"
        - "Current Address.City"
        - "Current Address.District"
        - "Current Address.State"
        - "Current Address.Pincode"
        - "Current Address.Country"
      sep: ", "
    permanent_address:
      join:
        - "Permanent Address.Address"
        - "Permanent Address.Landmark"
        - "Permanent Address.City"
        - "Permanent Address.District"
        - "Permanent Address.State"
        - "Permanent Address.Pincode"
        - "Permanent Address.Country"
      sep: ", "
      # When this flag is true and the permanent address is empty, the current address is used.
      same_as_above: "Permanent Address.Same as Above"
      same_as: address


# Documents. A file is one document, or a case bundle (case1_structured.json): the
# person sections of the form, each with its "Documents" list. Every document names
# its type in "Document Type" and keeps its values under "Fields" (when there is
# no "Fields" object, the values are read from the document entry itself).
documents:
  document_type_key: "Document Type"
  fields_key: "Fields"
  bundle:
    applicant_section: "Applicant"
    co_applicant_section: "Co-Applicant {n}"
    max_co_applicants: 6
    documents_key: "Documents"
    file_key: "File"

  # "Document Type" text -> type: the text must START with one of these names.
  # Anything else (IELTS, CIBIL report, bank statement, employee ID, Form 60, ...)
  # is OTHER: its name and date of birth are still compared.
  document_types:
    PAN: ["pan card", "pan", "permanent account number card"]
    AADHAAR: ["aadhaar", "aadhar", "e-aadhaar"]
    PASSPORT: ["passport"]
    VOTER_ID: ["voter id", "epic", "elector photo identity card"]
    DRIVING_LICENCE: ["driving licence", "driving license"]
    MARKSHEET: ["10th marksheet", "12th marksheet", "marksheet", "mark sheet", "marks statement"]
    DEGREE_CERTIFICATE: ["undergraduate consolidated", "consolidated statement of grades", "degree certificate", "provisional certificate"]
    ADMIT_LETTER: ["conditional offer letter", "offer letter", "admit letter", "admission letter"]

  # Field specs: a key path; a list of specs (first value found wins);
  # {join: [specs], sep}; or {join_all: path, sep} for an address split in parts.
  fields:
    PAN:
      name: "Name"
      father_name: "Father's Name"
      dob: "Date of Birth"
      id_number: ["Permanent Account Number", "PAN"]
    AADHAAR:
      name: "Name"
      dob: "Date of Birth"
      gender: "Gender"
      father_name: ["Father's Name", "S/O"]
      address: {join_all: "Address", sep: ", "}
      id_number: ["Your Aadhaar No.", "Aadhaar No.", "Aadhaar Number"]
    PASSPORT:
      name: {join: ["Given Name(s)", "Surname"], sep: " "}
      dob: "Date of Birth"
      gender: "Sex"
      id_number: ["Passport No.", "Passport No"]
      father_name: "Name of Father / Legal Guardian"
      mother_name: "Name of Mother"
      spouse_name: "Name of Spouse"
      address: "Address"
    VOTER_ID:
      name: "Elector's Name"
      # The card prints one "Father / Mother / Husband's Name" box. For a married
      # woman it is usually the husband, so it is not read as the father's name.
      father_name: "Father's Name"
      gender: "Sex"
      dob: "Date of Birth"
      address: {join_all: "Address", sep: ", "}
      id_number: ["Card No.", "EPIC No"]
    DRIVING_LICENCE:
      name: "Name"
      father_name: ["Son/Daughter/Wife of", "S/D/W of"]
      dob: "Date of Birth"
      address: {join_all: "Address", sep: ", "}
      id_number: ["DL No", "Licence No."]
    MARKSHEET:
      name: ["Candidate Name", "Name of the Candidate", "Name"]
      father_name: "Father's Name"
      mother_name: "Mother's Name"
      dob: "Date of Birth"
    DEGREE_CERTIFICATE:
      name: ["Name of the Candidate", "Candidate Name", "Name"]
      father_name: "Father's Name"
      mother_name: "Mother's Name"
      dob: "Date of Birth"
    ADMIT_LETTER:
      # "Addressee" on the offer letter holds the name and the address together,
      # so it is not mapped; add a key here once the letter has a name-only field.
      name: ["Student Name", "Name of the Student"]
      dob: "Date of Birth"
    OTHER:
      name:
        - "Name"
        - "Consumer Information.Name"
        - {join: ["Candidate Details.First Name(s)", "Candidate Details.Family Name"], sep: " "}
        - "Primary Holder"
        - "Full Name and Address of the declarant.Name (handwritten)"
      dob:
        - "Date of Birth"
        - "Consumer Information.Date of Birth"
        - "Candidate Details.Date of Birth"
