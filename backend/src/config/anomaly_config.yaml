# Anomaly Detection Agent configuration. Backend only: the UI reads the mode from
# GET /v1/info and changes its upload controls to match.
config_label: "2026-11-24.3"

# Which pipeline runs (the ANOMALY_MODE environment variable overrides this):
#   vision_llm  document images / PDFs -> vision LLM reads and cross-verifies (one call per person)
#   structured  key-value JSON per document -> payload built in code -> cross_verify (no LLM)
#   ocr_llm     raw OCR JSON -> LLM reads and cross-verifies (one call per person)
#   ocr_hybrid  raw OCR JSON -> LLM reads each document -> payload built in code -> cross_verify
mode: ocr_hybrid

modes:
  vision_llm:
    label: "Vision LLM (images / PDF): extraction and cross-verification by the LLM"
    accepts: [".pdf", ".png", ".jpg", ".jpeg", ".webp"]
    application_form_prompt: application_form_vision
    verification_prompt: document_verification_vision
  structured:
    label: "Structured JSON: payload in code, cross_verify compares (no LLM)"
    accepts: [".json"]
  ocr_llm:
    label: "Raw OCR JSON, full LLM: extraction and cross-verification by the LLM"
    accepts: [".json", ".txt"]
    application_form_prompt: application_form
    verification_prompt: document_verification
  ocr_hybrid:
    label: "Raw OCR JSON, hybrid: LLM extracts, cross_verify compares"
    accepts: [".json", ".txt"]
    application_form_prompt: application_form
    extraction_prompt: document_extraction

# Uploaded files and the JSON read from them are kept per case, file by file:
#   <DATA_DIR>/<case_id>/<application_form_dir>/<file>  and  <file>.extracted.json
#   <DATA_DIR>/<case_id>/<documents_dir>/<party_id>/<file>  and  <file>.extracted.json
storage:
  keep_uploads: true
  keep_extracted_json: true
  application_form_dir: application_form
  documents_dir: documents

# Vision LLM input. Bedrock Converse takes at most 20 images of 3.75 MB / 8000 px each
# per call; a person with more pages is sent in several calls.
vision:
  max_images_per_call: 20
  max_image_bytes: 3750000
  max_image_px: 8000
  pdf_input: images          # images: render every PDF page; document: send the PDF as it is
  pdf_render_dpi: 150
  jpeg_quality: 85

# Lead address(es) compared with the documents (to confirm with the client:
# current address only, or the permanent address too).
lead_address_fields: [address]

id_patterns:
  passport: "[A-Z][0-9]{7}"
  driving_licence: "[A-Z]{2}[0-9]{11,13}"

# Fields the LLM is told to look for on each document type.
fields_by_doc_type:
  PAN: [name, father_name, dob, id_number]
  AADHAAR: [name, dob, gender, father_name, spouse_name, address, id_number]
  PASSPORT: [name, dob, gender, id_number, father_name, mother_name, spouse_name, address]
  VOTER_ID: [name, father_name, spouse_name, gender, dob, address, id_number]
  DRIVING_LICENCE: [name, father_name, spouse_name, dob, address, id_number]
  MARKSHEET: [name, father_name, mother_name, dob]
  DEGREE_CERTIFICATE: [name, father_name, mother_name, dob]
  ADMIT_LETTER: [name, dob]
  OTHER: [name, father_name, mother_name, dob, address, id_number]

# Cross-verification checks, in checklist order (no rule numbers in the output).
checks:
  NAME:
    label: Name cross-check
    severity: High
    mitigant: Obtain affidavit / one-and-same-person declaration; correct manual bureau record; recommend basis justification.
  PARENT_NAME:
    label: Parent name cross-check
    severity: High
    mitigant: Confirm the co-applicant is the applicant's parent; obtain relationship proof / one-and-same-person declaration.
  DOB:
    label: Date of birth cross-check
    severity: High
    mitigant: Obtain affidavit / one-and-same-person declaration; correct manual bureau record; recommend basis justification.
  FATHER_NAME:
    label: Father name cross-check
    severity: Medium
    mitigant: Clarify the father's name; obtain one-and-same-person declaration if needed.
  MOTHER_NAME:
    label: Mother name cross-check
    severity: Medium
    mitigant: Clarify the mother's name; obtain one-and-same-person declaration if needed.
  ADDRESS:
    label: Address cross-check
    severity: Medium
    mitigant: Obtain address proof / residence verification.
  HOUSEHOLD_ADDRESS:
    label: Household address cross-check
    severity: Medium
    mitigant: Confirm where the parent co-applicant lives; obtain address proof.
  PAN:
    label: PAN number cross-check
    severity: High
    mitigant: Correct the PAN in the lead or obtain the correct PAN card.
  AADHAAR:
    label: Aadhaar number cross-check (last 4 digits)
    severity: High
    mitigant: Correct the Aadhaar number in the lead or obtain the correct Aadhaar.
  PASSPORT_NO:
    label: Passport number cross-check
    severity: Medium
    mitigant: Correct the passport number in the lead or obtain the correct passport copy.
  DL_NO:
    label: Driving licence number cross-check
    severity: Medium
    mitigant: Correct the licence number in the lead or obtain the correct licence copy.
  VOTER_ID:
    label: Voter ID number cross-check
    severity: Medium
    mitigant: Correct the voter ID in the lead or obtain the correct voter ID copy.

# Third-party checks. The APIs are not available yet, so every answer is mocked.
third_party:
  bureau_address_window_months: 12
  face_match_min_pct: 75
  voter_dl_verification_window_days: null
  pan_link_condition: Aadhaar to be linked to PAN before disbursement
  mock_defaults:
    face_match_pct: 92.0
    face_match_status: SUCCESS
    bureau_address_age_days: 60
  checks:
    BUREAU_REPORT:
      label: Bureau report cross-check (mock)
      title: Bureau name, date of birth and address
      severity: High
      mitigant: Obtain affidavit / one-and-same-person declaration; correct manual bureau record.
    BUREAU_ADDRESS:
      label: Bureau address cross-check (mock)
      title: Address vs bureau (last 12 months)
      severity: Medium
      mitigant: Obtain address proof / residence verification.
    PAN_AADHAAR_LINK:
      label: PAN-Aadhaar link check (mock)
      title: PAN-Aadhaar linkage
      severity: Medium
      mitigant: Linkage before disbursement.
    VOTER_DL_VERIFICATION:
      label: Voter ID / DL verification (mock)
      title: Voter ID / driving licence verification
      severity: Low
      mitigant: Provide justification by CM.
    EMAIL_VALIDATION:
      label: Email ID check (mock)
      title: Email ID validation
      severity: Low
      mitigant: Correct before sanction.
    FACE_MATCH:
      label: Face match check (mock)
      title: Face match (75% or more)
      severity: High
      mitigant: "Critical: if face match is below 75%, the credit manager must justify it in OTHER REMARKS in the CAM."
